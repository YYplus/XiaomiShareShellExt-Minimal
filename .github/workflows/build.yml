name: Build Windows package

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Expand source and patch manifest IDs
        shell: pwsh
        run: |
          $b64 = (Get-Content source.b64 -Raw).Trim()
          [IO.File]::WriteAllBytes("source.tar.gz", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Path source -Force | Out-Null
          tar -xzf source.tar.gz -C source
          $manifest = "source/XiaomiShareShellExt-Minimal/src/SparsePackage/AppxManifest.xml"
          $xml = Get-Content $manifest -Raw
          $xml = $xml.Replace('Id="XiaomiShare.Send"', 'Id="XiaomiShareSend"')
          $xml = $xml.Replace('Id="XiaomiShare.SendDirectory"', 'Id="XiaomiShareSendDirectory"')
          Set-Content -Path $manifest -Value $xml -Encoding utf8NoBOM

      - name: Build minimal Xiaomi Share shell extension
        shell: pwsh
        working-directory: source/XiaomiShareShellExt-Minimal
        run: .\Build.ps1

      - name: Stage install bundle
        shell: pwsh
        working-directory: source/XiaomiShareShellExt-Minimal
        run: |
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item dist artifact\dist -Recurse
          Copy-Item README.md,LICENSE,NOTICE.md artifact\
          Copy-Item ..\..\installer\Install.ps1 artifact\Install.ps1 -Force
          Copy-Item ..\..\installer\Uninstall.ps1 artifact\Uninstall.ps1 -Force

      - name: Upload install bundle
        uses: actions/upload-artifact@v4
        with:
          name: XiaomiShareShellExt-Minimal-win-x64
          path: source/XiaomiShareShellExt-Minimal/artifact
          if-no-files-found: error
